<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#fdf6e3">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<title>Not found</title>
<style>
:root{
  --base3:#fdf6e3; --base2:#eee8d5; --base1:#93a1a1; --base00:#657b83; --base01:#586e75;
  --orange:#cb4b16; --blue:#268bd2; --cyan:#2aa198;
  --sans:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono","SF Mono",ui-monospace,Menlo,Consolas,monospace;
  --hair:#e2dbc5;
}
*{box-sizing:border-box}
body{margin:0; background:var(--base3); color:var(--base00);
     font-family:var(--sans); font-size:19px; line-height:1.62; -webkit-font-smoothing:antialiased}
.progress{position:fixed; top:0; left:0; right:0; height:3px; z-index:60; pointer-events:none}
.progress>div{height:100%; width:0; background:var(--blue)}
.bar{display:flex; gap:.75rem; align-items:center; flex-wrap:wrap;
     padding:.6rem clamp(1rem,5vw,3rem); border-bottom:1px solid var(--hair);
     font-family:var(--mono); font-size:12px; color:var(--base1)}
.bar a{color:var(--base01); text-decoration:none}
.bar a:hover{color:var(--blue)}
.bar .spacer{flex:1}
.wrap{max-width:68ch; margin:0 auto; padding:0 clamp(1rem,5vw,2rem)}
h1{font-weight:600; font-size:clamp(1.75rem,4.6vw,2.45rem); line-height:1.15;
   letter-spacing:-.028em; color:var(--base01); margin:clamp(2.4rem,7vh,4rem) 0 .8rem}
h2{font-weight:600; font-size:1.16rem; color:var(--base01); letter-spacing:-.01em;
   margin:2.8rem 0 1rem; padding-top:1rem; border-top:1px solid var(--hair)}
p{margin:0 0 1.05rem}
a{color:var(--blue); text-underline-offset:2px}
a:hover{color:var(--cyan)}
code{font-family:var(--mono); font-size:.85em; background:var(--base2);
     padding:.08em .3em; border-radius:2px; color:var(--base01)}
.sub{color:var(--base00); max-width:52ch}
.posts{list-style:none; margin:1.4rem 0 0; padding:0}
.posts li{padding:1.1rem 0; border-top:1px solid var(--hair)}
.posts li:last-child{border-bottom:1px solid var(--hair)}
.posts h3{margin:0 0 .3rem; font-size:1.16rem; font-weight:600; letter-spacing:-.012em}
.posts h3 a{color:var(--base01); text-decoration:none}
.posts h3 a:hover{color:var(--blue)}
.posts p{margin:0 0 .45rem; font-size:.95em; color:var(--base00)}
.pmeta{font-family:var(--mono); font-size:11.5px; color:var(--base1);
       display:flex; gap:.5rem .9rem; flex-wrap:wrap}
.pmeta .tag{color:var(--cyan)}
footer{border-top:1px solid var(--hair); margin-top:3.5rem; padding:1.6rem 0 3.5rem;
       font-family:var(--mono); font-size:12px; color:var(--base1)}
footer a{color:var(--base00)}
@media (max-width:560px){ body{font-size:16.5px} }
</style>
<div class="progress" aria-hidden="true"><div id="progress-bar"></div></div>
<div class="bar">
  <a href="/">namanjaswani27.github.io</a>
  <span class="spacer"></span>
  <span>404</span>
</div>
<div class="wrap">
  <h1>Nothing here</h1>
  <p class="sub">Try the <a href="/blog/">blog</a>.</p>
  <footer>namanjaswani27.github.io</footer>
</div>

<script>
(function(){
  var b=document.getElementById("progress-bar");
  if(!b) return;
  var queued=false;
  function update(){
    var d=document.documentElement;
    var max=d.scrollHeight-d.clientHeight;
    b.style.width=(max>0 ? (d.scrollTop/max)*100 : 0)+"%";
    queued=false;
  }
  addEventListener("scroll",function(){ if(!queued){queued=true; requestAnimationFrame(update);} },{passive:true});
  addEventListener("resize",update);
  update();
})();
</script>
